<!DOCTYPE html>

        extend: {

  <style>

      letter-spacing: 0;

</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none">
  <div class="h-1 w-full bg-white/5 relative z-50">

    let currentSlide = 0;
    const totalSlides = SLIDES.length;

    function renderSlide(index) {
      if (index < 0) index = 0;
      if (index >= totalSlides) index = totalSlides - 1;
      currentSlide = index;

      const slide = SLIDES[currentSlide];
      document.getElementById('slideCategory').textContent = slide.category;
      document.getElementById('currentSlideNum').textContent = String(currentSlide + 1).padStart(2, '0');
      document.getElementById('totalSlidesNum').textContent = String(totalSlides).padStart(2, '0');
      document.getElementById('progressBar').style.width = `${((currentSlide + 1) / totalSlides) * 100}%`;

      const container = document.getElementById('slideContent');
      container.innerHTML = `
        <div class="space-y-5">
          <div class="space-y-2 max-w-5xl">
            <h2 class="text-3xl md:text-5xl font-black text-white leading-tight">${slide.title}</h2>
            <p class="text-slate-400 text-sm md:text-lg font-normal max-w-4xl">${slide.insight}</p>
          </div>
          <div class="pt-1">${slide.content}</div>
        </div>
      `;

      document.getElementById('speakerNotesContent').textContent = slide.notes;
      container.classList.remove('slide-enter');
      void container.offsetWidth;
      container.classList.add('slide-enter');
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) renderSlide(currentSlide + 1);
    }

    function prevSlide() {
      if (currentSlide > 0) renderSlide(currentSlide - 1);
    }

    function toggleNotes() {
      document.getElementById('speakerNotesDrawer').classList.toggle('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 's' || e.key === 'S') {
        toggleNotes();
      } else if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
    });

    const requestedSlide = Number(new URLSearchParams(window.location.search).get('slide'));
    renderSlide(Number.isInteger(requestedSlide) && requestedSlide > 0 ? requestedSlide - 1 : 0);
  </script>
